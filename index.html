function toBase64(file) {
  return new Promise(function(res,rej) {
    if(file.type==="application/pdf") {
      var r=new FileReader();
      r.onload=function(){res(r.result.split(",")[1]);};
      r.onerror=rej; r.readAsDataURL(file); return;
    }
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function() {
      var MAX=2000,w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg",0.92).split(",")[1]);
    };
    img.onerror=rej; img.src=url;
  });
}

  function saveUsers(newUsers) {
    var oldMap = {}; users.forEach(function(u){ oldMap[u.id]=u; });
    var newIds = {}; newUsers.forEach(function(u){ newIds[u.id]=true; });
    Object.keys(oldMap).forEach(function(id){
      if(!newIds[id]) db.collection("users").doc(id).delete().catch(function(e){console.error(e);});
    });
    newUsers.forEach(function(u){
      var old = oldMap[u.id];
      if(!old || JSON.stringify(old)!==JSON.stringify(u)) {
        db.collection("users").doc(u.id).set(u).catch(function(e){console.error(e);});
      }
    });
    setUsers(newUsers);
  }
  function saveHistory(newHist) {
    var oldMap = {}; history.forEach(function(h){ oldMap[h.id]=h; });
    var newIds = {}; newHist.forEach(function(h){ newIds[h.id]=true; });
    Object.keys(oldMap).forEach(function(id){
      if(!newIds[id]) db.collection("history").doc(String(id)).delete().catch(function(e){console.error(e);});
    });
    newHist.forEach(function(h){
      var old = oldMap[h.id];
      if(!old || JSON.stringify(old)!==JSON.stringify(h)) {
        db.collection("history").doc(String(h.id)).set(h).catch(function(e){console.error(e);});
      }
    });
    setHistory(newHist);
  }
  function saveApiKey(k) {
    setApiKey(k);

  async function analyze() {

    setError(""); setScreen("loading_review");
    var msgs = ["문서 업로드 중...","이미지 분석 중...","체크리스트 매핑 중...","누락 항목 검증 중...","결과 생성 중..."];
    var mi = 0; setLoadMsg(msgs[0]);
    var iv = setInterval(function(){ mi=(mi+1)%msgs.length; setLoadMsg(msgs[mi]); }, 1800);
    try {
      var limitedFiles = files.slice(0,1);
      var parts = [];
      for (var i=0; i<limitedFiles.length; i++) {
        var f = limitedFiles[i];
        var b64 = await toBase64(f);
        parts.push(f.type==="application/pdf"
          ? {type:"document", source:{type:"base64", media_type:"application/pdf", data:b64}}
          : {type:"image",    source:{type:"base64", media_type:"image/jpeg", data:b64}});
      }
      var cat = CATEGORIES.find(function(c){return c.id===selCat;});
      var crit = (CRITERIA[selCat]||[]).map(function(i,idx){return (idx+1)+". "+getText(i.label)+" ["+i.id+"]";}).join("\n");
      parts.push({type:"text", text:"당신은 꼼꼼하지만 공정한 산업안전 문서 검토 전문가입니다. ["+cat.label+"] 문서를 분석하세요.\n\n중요한 검토 원칙:\n- 문서를 분석할 때 페이지 중앙의 큰 표들뿐 아니라, 페이지 맨 아래쪽이나 우측 하단 구석처럼 작고 눈에 덜 띄는 위치에 있는 서명란도 반드시 동일한 주의력으로 확인하세요. 특히 '작업완료', '운전원 확인' 같은 항목은 페이지 최하단 구석에 작게 배치되는 경우가 많아 놓치기 쉬우니, 페이지의 가장 아래쪽 줄까지 빠짐없이 스캔하세요.\n- 서명란 판정 기준(매우 중요, 문서 전체의 모든 서명·사인란에 공통 적용 — 결재란, TBM 일지, 안전점검표, 위험성평가 서명, 작업완료 확인, LOTO 서명, 안전감시자 서명 등 예외 없이 전부 동일하게 적용): 서명은 이름을 정확히 읽거나 판독할 필요가 전혀 없습니다. 해당 서명란/사인란 안에 어떤 형태로든 필기 흔적(사인, 도장, 낙서 같은 표시, 체크, X자 등 무엇이든)이 존재하면 '서명 있음'으로 보고 pass로 판정하세요. 글씨체가 흘려 써서 이름을 알아볼 수 없어도 상관없이 pass입니다. 오직 그 칸이 완전히 비어있어서 아무 흔적도 없을 때만 fail로 판정하세요. 즉 '무엇이 적혀있는지'가 아니라 '무엇이든 적혀있는지'만 확인하면 됩니다.\n- 항목명에 '결재 서명', '체크 완료' 등으로 되어 있어도, 이는 관련된 모든 칸/란이 빠짐없이 채워졌는지를 뜻합니다. 문서 안에 서명이나 체크가 '어딘가 하나라도' 있다고 해서 바로 전체를 pass로 판정하지 마세요.\n- 결재란처럼 여러 단계(예: 신청/검토·확인/검토)와 여러 역할(회사명/팀장/담당/리더/파트장 등)로 나뉜 표는, 그 표의 모든 칸을 하나하나 개별적으로 확인하세요(단, 위 서명란 판정 기준대로 흔적만 있으면 됨). 명백히 비어있는 칸이 실제로 보이면 fail로 판정하고, note에 구체적으로 어느 칸이 비었는지 적으세요.\n- 체크리스트(□/○ 등)가 여러 개 나열된 항목도 각 체크박스를 개별적으로 확인하세요. 실제로 체크가 안 된 게 명확히 보이면 fail로 판정하세요.\n- 매우 중요: fail은 '비어있는 것이 이미지에서 명확히 보일 때'만 사용하세요. 이미지 화질, 각도, 압축 등의 이유로 그 칸 자체에 뭔가 있는지 없는지조차 확신하기 어렵다면(흔적의 유무 자체가 불확실한 경우), 절대로 임의로 fail 처리하지 말고 status를 'unknown'으로 표시하고 note에 '화질상 확인어려움' 등 이유를 적으세요. fail은 실제 누락을 의미하므로, 단순히 확신이 안 선다는 이유로 fail을 남발하면 안 됩니다.\n- LOTO(체결/해제) 관련 항목(LOTO 발행번호, 기기조작 및 서명 등)은 아래 규칙으로 판정하세요: PTW 문서에서 'LOTO 발행번호'란을 확인했을 때, 그 란이 비어있으면(공란) 체크박스 상태나 첨부서류 여부와 상관없이 관련 LOTO 항목 전체를 'pass'로 판정하세요. LOTO 발행번호가 실제로 기재되어 있는 경우에만, 나머지 관련 내용(서명 등)이 채워졌는지 정상적으로 확인해서 pass/fail을 판정하세요.\n- 안전감시자지정서 항목은 반드시 아래 3단계 순서로 판정하세요 (작업 특성에 따라 애초에 해당하지 않을 수 있음):\n  1단계) PTW 본문에 '안전감시자 필요여부' 체크박스가 있는지 확인. 체크가 안 되어 있거나 '불필요/해당없음'으로 표시되어 있다면 → 관련 항목 전부 status를 'na'(해당없음)로 판정하고 즉시 종료 (누락으로 판정하지 말 것).\n  2단계) 필요함으로 체크되어 있다면, PTW의 '첨부서류' 체크란에서 '안전감시자 지정서'가 체크/첨부되어 있는지 확인. 체크가 안 되어 있다면 → fail로 판정하고 note에 '첨부서류 미체크' 등으로 기재.\n  3단계) 첨부서류 체크까지 확인되면, 실제 내용(감시자 인적사항, 서명 등)이 기재되어 있는지 확인하여 최종 pass/fail을 판정.\n  즉, 1단계에서 애초에 불필요한 작업이면 절대 fail이나 unknown으로 판정하지 말고 na로 처리하세요.\n- '작업완료확인 시 운전원 서명' 항목은 문서 하단에 보통 두 개의 서로 다른 요소로 구성됩니다: (a) '작업완료 및 정비완료 확인' 같은 체크박스/체크표시, 그리고 (b) 그 옆의 '운전원' 칸에 실제로 적힌 서명·사인 흔적. 이 둘은 완전히 별개입니다. 체크박스에 체크(☑)가 되어 있다고 해서 운전원 서명까지 있다고 착각하면 안 됩니다. 반드시 '운전원' 칸 자체를 별도로 확인하되(위 서명란 판정 기준대로 흔적만 있으면 pass), 그 칸이 완전히 비어있으면 fail로 판정하세요.\n\nstatus: pass=관련 칸/란 모두 명확히 기재완료(또는 LOTO 발행번호란이 비어있는 경우), fail=명백히 누락/불완전한 것이 보임, na=해당없음(작업특성상 불필요 포함), unknown=이미지로 확신 어려움(사람이 재확인 필요)\n\n검토항목:\n"+crit+"\n\n추가로 문서 상단에서 아래 정보도 찾아서 함께 추출하세요. **매우 중요: 이 정보들은 반드시 문서에 실제로 적혀 있는 글자를 옮겨적으세요. 절대 다른 칸의 값을 가져오거나, 문서에 없는 이름/부서명을 지어내지 마세요. 다만 글씨가 다소 흐릿하거나 필기체라도, 그 칸 자체에 뭔가 적혀 있다면 최대한 판독해서 가장 근접하게 읽은 값을 기입하세요(빈칸으로 남기지 말 것). 정말로 그 칸 자체가 비어있어서 아무것도 적혀 있지 않은 경우에만 빈 문자열(\"\")로 남겨두세요.**\n- workDate: 작업일자(허가기간의 시작일 등, 예: 2026-07-27)\n- dept: '작업책임자' 항목의 '소속:' 바로 뒤에 기재된 값 그대로 (예: HPS환경설비)\n- teamLeader: 상단 결재란 매트릭스에서 '감독 확인(EES)' 열(신청/운전 승인 열이 아님)의 '팀장' 행에 실제로 적힌 성명 그대로. 다른 열의 팀장이나 다른 인물과 혼동하지 말 것.\n- workName: 작업명\n\nJSON만 출력 (다른 텍스트 없이):\n{\"results\":{\"id\":{\"status\":\"pass|fail|na|unknown\",\"note\":\"15자이내\"}},\"summary\":\"50자이내\",\"meta\":{\"workDate\":\"\",\"dept\":\"\",\"teamLeader\":\"\",\"workName\":\"\"}}"});

      var resp, att = 0;
      while (att < 5) {
        att++;
        if(att===1) await new Promise(function(r){setTimeout(r,300);});
        resp = await fetch("https://api.anthropic.com/v1/messages", {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "x-api-key":apiKey,
            "anthropic-version":"2023-06-01",
            "anthropic-dangerous-direct-browser-access":"true"
          },
          body:JSON.stringify({model:"claude-haiku-4-5-20251001", max_tokens:3000, temperature:0, messages:[{role:"user", content:parts}]})
        });
        if (resp.status===429||resp.status===529||resp.status===503) {
          var wait = att===1?5000:att===2?10000:att===3?20000:30000;
          setLoadMsg("요청 한도 초과 — "+att+"회 재시도 ("+Math.round(wait/1000)+"초 대기)");
          await new Promise(function(r){setTimeout(r,wait);});
          continue;
        }
        break;
      }
      if (!resp.ok) throw new Error("API "+resp.status);
      var data = await resp.json();
      var raw = (data.content||[]).map(function(c){return c.text||"";}).join("");
      var clean = raw.replace(/```json|```/g,"").trim();
      if(!clean.endsWith("}")) {
        var lb = clean.lastIndexOf("},");
        clean = lb>0 ? clean.substring(0,lb+1)+"}},\"summary\":\"검토 완료\"}" : "{\"results\":{},\"summary\":\"다시 시도해 주세요\"}";
      }
      var parsed;
      try { parsed = JSON.parse(clean); }
      catch(e) { parsed = {results:{}, summary:"일부 항목만 분석됨"}; }

      var r={}, n={};
      Object.entries(parsed.results||{}).forEach(function(entry){
        r[entry[0]]=entry[1].status||"unknown";
        if(entry[1].note) n[entry[0]]=entry[1].note;

      var items = CRITERIA[selCat]||[];

      var missingText = items.filter(function(i){return r[i.id]==="fail";})
        .map(function(i){return getText(i.label)+(n[i.id]?"("+n[i.id]+")":"");})
        .join("; ");
      var entry2 = {
        id:Date.now(), user:currentUser.name, category:cat.label, catId:cat.id,
        date:new Date().toLocaleString("ko-KR"), results:r, summary:parsed.summary||"",
        workDate: meta.workDate||"", dept: meta.dept||"", teamLeader: meta.teamLeader||"",
        workName: meta.workName||"", missingText: missingText
      };
      saveHistory([entry2].concat(history));
      clearInterval(iv); setScreen("result");
    } catch(e) {
      clearInterval(iv); setError("분석 오류: "+e.message); setScreen("error");
    }
  }

            <p style={{margin:0,fontSize:12,color:C.gray}}>PDF 또는 이미지 업로드 후 AI 자동 검토</p></div>
          </div>
          <div style={{background:C.cardBg,borderRadius:12,boxShadow:"0 1px 6px rgba(0,0,0,0.08)",overflow:"hidden",marginBottom:"1rem"}}>
            <div style={{background:C.navyMid,padding:"10px 16px"}}><span style={{color:C.text,fontWeight:600,fontSize:13}}>📁 문서 업로드 (최대 1개)</span></div>
            <div style={{padding:"1.25rem"}}>

                style={{border:"1.5px dashed "+C.accent+"55",borderRadius:10,padding:"1.5rem",textAlign:"center",cursor:"pointer"}}>
                <div style={{fontSize:30,marginBottom:6}}>📁</div>
                <p style={{margin:"0 0 2px",fontWeight:600,color:C.navy,fontSize:13}}>PDF 또는 이미지를 드래그하거나 클릭하여 업로드</p>

      </div>
      {tab==="users"&&<div style={{background:"#fff",borderRadius:10,boxShadow:"0 1px 5px rgba(0,0,0,0.07)",overflow:"hidden"}}>
        <div style={{background:"linear-gradient(135deg,"+C.navy+","+C.navyMid+")",padding:"10px 16px"}}><span style={{color:C.text,fontWeight:600,fontSize:13}}>회원 목록 ({users.length}명)</span></div>
        {users.map(function(u,i,arr){return <div key={u.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 16px",borderBottom:i<arr.length-1?"1px solid #f3f4f6":"none"}}>
          <div style={{width:32,height:32,borderRadius:"50%",background:u.role==="admin"?C.gold+"33":C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:u.role==="admin"?C.amber:C.gray}}>{u.name?u.name[0]:""}</div>
          <div style={{flex:1}}><p style={{margin:0,fontSize:13,fontWeight:600,color:C.navy}}>{u.name} <span style={{fontSize:11,color:C.gray}}>({u.id})</span></p></div>
          <select value={u.role} onChange={function(e){if(u.id==="admin")return;onSave(users.map(function(x){return x.id===u.id?Object.assign({},x,{role:e.target.value}):x;}));}} disabled={u.id==="admin"} style={{fontSize:11,padding:"2px 5px",border:"1px solid #e5e7eb",borderRadius:5}}>
            <option value="admin">👑 관리자</option><option value="user">👤 일반</option>
          </select>
          <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:600,background:u.status==="pending"?C.amberBg:u.status==="blocked"?C.redBg:C.greenBg,color:u.status==="pending"?C.amber:u.status==="blocked"?C.red:C.green}}>{u.status==="pending"?"승인대기":u.status==="blocked"?"차단":"활성"}</span>
          {u.id!=="admin"&&u.status==="pending"&&<div style={{display:"flex",gap:4}}>
            <button onClick={function(){onSave(users.map(function(x){return x.id===u.id?Object.assign({},x,{status:"active"}):x;}));}} style={{padding:"4px 10px",borderRadius:6,border:"none",background:C.green,color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer"}}>✅ 승인</button>
            <button onClick={function(){if(confirm(u.name+"님의 가입 신청을 거절(삭제)하시겠습니까?"))onSave(users.filter(function(x){return x.id!==u.id;}));}} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+C.redBorder,background:"#fff",color:C.red,fontSize:11,fontWeight:600,cursor:"pointer"}}>❌ 거절</button>
          </div>}
          {u.id!=="admin"&&u.status!=="pending"&&<div style={{display:"flex",gap:2}}>
            <button onClick={function(){onSave(users.map(function(x){return x.id===u.id?Object.assign({},x,{status:x.status==="blocked"?"active":"blocked"}):x;}));}} style={{background:"none",border:"none",cursor:"pointer",fontSize:14}}>{u.status==="blocked"?"🔓":"🔒"}</button>
            <button onClick={function(){onSave(users.filter(function(x){return x.id!==u.id;}));}} style={{background:"none",border:"none",cursor:"pointer",fontSize:14}}>🗑️</button>
          </div>}
        </div>;})}
      </div>}
      {tab==="history"&&<div style={{background:"#fff",borderRadius:10,boxShadow:"0 1px 5px rgba(0,0,0,0.07)",overflow:"hidden"}}>
        <div style={{background:"linear-gradient(135deg,"+C.navy+","+C.navyMid+")",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{color:C.text,fontWeight:600,fontSize:13}}>전체 검토 이력 ({history.length}건)</span>
          <div style={{display:"flex",gap:6}}>
            {history.length>0&&<button onClick={exportHistoryToExcel} style={{padding:"5px 12px",borderRadius:6,border:"none",background:C.gold,color:"#1a1a1a",fontSize:11,fontWeight:700,cursor:"pointer"}}>📥 엑셀 다운로드</button>}
            {history.length>0&&<button onClick={function(){if(confirm("전체 검토 이력 "+history.length+"건을 모두 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다."))onSaveHistory([]);}} style={{padding:"5px 12px",borderRadius:6,border:"1px solid "+C.redBorder,background:"#fff",color:C.red,fontSize:11,fontWeight:700,cursor:"pointer"}}>🗑️ 전체 삭제</button>}
          </div>
        </div>
        {history.length===0&&<p style={{padding:"2rem",textAlign:"center",fontSize:13,color:C.gray}}>검토 이력이 없습니다.</p>}
        {history.length>0&&<div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{background:C.bg}}>
                {["번호","작업일자","허가서 유형","작업책임자 소속","감독확인 팀장","작업명","누락내용",""].map(function(h){
                  return <th key={h} style={{padding:"8px 10px",textAlign:"left",fontWeight:700,color:C.navy,borderBottom:"2px solid #e5e7eb",whiteSpace:"nowrap"}}>{h}</th>;
                })}
              </tr>
            </thead>
            <tbody>
              {history.map(function(h,idx){
                var isEd = editingId===h.id;
                var inputStyle={width:"100%",padding:"4px 6px",fontSize:12,border:"1px solid "+C.accent,borderRadius:4,outline:"none"};
                return <tr key={h.id} style={{borderBottom:"1px solid #f3f4f6",background:isEd?"#f0f7ff":"transparent"}}>
                  <td style={{padding:"8px 10px",color:C.gray}}>{idx+1}</td>
                  <td style={{padding:"8px 10px",color:C.navy,whiteSpace:"nowrap"}}>{isEd?<input style={inputStyle} value={editDraft.workDate} onChange={function(e){setEditDraft(Object.assign({},editDraft,{workDate:e.target.value}));}}/>:(h.workDate||"-")}</td>
                  <td style={{padding:"8px 10px",color:C.navy,whiteSpace:"nowrap"}}>{isEd?
                    <select style={inputStyle} value={editDraft.category} onChange={function(e){setEditDraft(Object.assign({},editDraft,{category:e.target.value}));}}>
                      {CATEGORIES.map(function(c){return <option key={c.id} value={c.label}>{c.label}</option>;})}
                    </select>
                    :(h.category||"-")}</td>
                  <td style={{padding:"8px 10px",color:C.navy}}>{isEd?<input style={inputStyle} value={editDraft.dept} onChange={function(e){setEditDraft(Object.assign({},editDraft,{dept:e.target.value}));}}/>:(h.dept||"-")}</td>
                  <td style={{padding:"8px 10px",color:C.navy}}>{isEd?<input style={inputStyle} value={editDraft.teamLeader} onChange={function(e){setEditDraft(Object.assign({},editDraft,{teamLeader:e.target.value}));}}/>:(h.teamLeader||"-")}</td>
                  <td style={{padding:"8px 10px",color:C.navy}}>{isEd?<input style={inputStyle} value={editDraft.workName} onChange={function(e){setEditDraft(Object.assign({},editDraft,{workName:e.target.value}));}}/>:(h.workName||"-")}</td>
                  <td style={{padding:"8px 10px",color:h.missingText?C.red:C.gray}}>{isEd?<input style={inputStyle} value={editDraft.missingText} onChange={function(e){setEditDraft(Object.assign({},editDraft,{missingText:e.target.value}));}}/>:(h.missingText||"(없음)")}</td>
                  <td style={{padding:"8px 10px",textAlign:"center",whiteSpace:"nowrap"}}>
                    {isEd?<span style={{display:"flex",gap:6,justifyContent:"center"}}>
                      <button onClick={function(){saveEdit(h.id);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:14}} title="저장">💾</button>
                      <button onClick={cancelEdit} style={{background:"none",border:"none",cursor:"pointer",fontSize:14}} title="취소">✖️</button>
                    </span>:<span style={{display:"flex",gap:6,justifyContent:"center"}}>
                      <button onClick={function(){startEdit(h);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:14}} title="수정">✏️</button>
                      <button onClick={function(){if(confirm("이 검토 이력을 삭제하시겠습니까?"))onSaveHistory(history.filter(function(x){return x.id!==h.id;}));}} style={{background:"none",border:"none",cursor:"pointer",fontSize:14}} title="삭제">🗑️</button>
                    </span>}
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>}
      </div>}
    </div>
  </div>;
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
